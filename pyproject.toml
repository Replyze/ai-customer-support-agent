[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-support-agent"
version = "0.1.0"
description = "AI customer support agent in Python: answers only from your Markdown docs with citations, and hands off to a human when it should."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Replyze" }]
keywords = ["ai customer support", "customer support agent", "chatbot", "claude", "anthropic", "rag", "bm25", "human handoff"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = ["anthropic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
support-agent = "support_agent.cli:main"

[project.urls]
Homepage = "https://replyze.chat/?utm_source=github&utm_medium=referral&utm_campaign=ai-customer-support-agent"

[tool.setuptools]
packages = ["support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
